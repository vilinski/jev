[package]
name = "jev"
version = "0.2.0"
edition = "2024"
description = "CLI for System One decision models (TypeSafe Jev, Cloudflare Clef, local Ollama, OpenAI via logprobs): typed questions in, calibrated probabilities out, API key kept out of the caller"
keywords = ["typesafe", "jev", "clef", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/vilinski/jev"
homepage = "https://ai.vilinski.dev/jev-benchmark/"

[dependencies]
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
keyring = "4"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "http-json", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
rpassword = "7"
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
